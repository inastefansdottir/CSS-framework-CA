<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Petify | Profile</title>
    <link rel="icon" href="/images/favicon.ico" type="image/x-icon" />
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../node_modules/@fortawesome/fontawesome-free/css/all.min.css">
</head>

<body class="bg-primary-light text-primary">

    <!-- Navbar -->
    <header>
        <nav class="navbar navbar-expand-lg navbar-dark fixed-top bg-primary-light shadow-sm">
            <div class="container">
                <a class="navbar-brand" href="../feed/index.html">
                    <img src="../images/petify-cat-dark.svg" alt="Petify logo" height="40" class="me-1">
                    <img src="../images/petify-logo-text.svg" alt="Petify logo" height="35">
                </a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                    aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                    <i class="fa-solid fa-bars"></i>
                </button>
                <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
                    <ul class="navbar-nav">
                        <li class="nav-item">
                            <a class="nav-link fw-bold text-secondary text-hover" href="../feed/index.html">Feed</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link fw-bold text-primary" aria-current="page" href="#">Profile</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link fw-bold text-secondary text-hover" href="../">Log out</a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <!-- Profile Section -->
    <main class="container" style="max-width: 932px;">
        <section class="text-center bg-primary-light">
            <div class="mb-3">
                <img src="../images/oreo-profile.jpg" alt="Profile photo" class="rounded-circle" width="100"
                    height="100">
            </div>
            <h1 class="fw-black mb-3">Oreo</h1>
            <button class="btn btn-outline-primary rounded-pill px-4 mb-4">Edit profile</button>

            <div class="d-flex justify-content-center text-center">
                <div class="px-3">
                    <p class="fw-bold mb-0">1.1K</p>
                    <small>Following</small>
                </div>
                <div class="border-start border-primary mx-2"></div>
                <div class="px-3">
                    <p class="fw-bold mb-0">100</p>
                    <small>Followers</small>
                </div>
                <div class="border-start border-primary mx-2"></div>
                <div class="px-3">
                    <p class="fw-bold mb-0">9</p>
                    <small>Posts</small>
                </div>
            </div>
        </section>

        <!-- Posts thumbnail section -->
        <section class="mt-4 mb-5 profile-gallery">
            <div class="row g-0">
                <div class="col-4"><img src="../images/oreo-post.jpg" class="img-fluid" alt="Post image"></div>
                <div class="col-4"><img src="../images/oreo-2.jpg" class="img-fluid" alt="Post image">
                </div>
                <div class="col-4"><img src="../images/oreo-3.jpg" class="img-fluid" alt="Post image">
                </div>
                <div class="col-4"><img src="../images/oreo-4.jpg" class="img-fluid" alt="Post image"></div>
                <div class="col-4"><img src="../images/oreo-5.jpg" class="img-fluid" alt="Post image">
                </div>
                <div class="col-4"><img src="../images/oreo-6.jpg" class="img-fluid" alt="Post image">
                </div>
                <div class="col-4"><img src="../images/oreo-7.jpg" class="img-fluid" alt="Post image">
                </div>
                <div class="col-4"><img src="../images/oreo-8.jpg" class="img-fluid" alt="Post image">
                </div>
                <div class="col-4"><img src="../images/oreo-9.jpg" class="img-fluid" alt="Post image">
                </div>
            </div>
        </section>
    </main>

    <script src="../node_modules/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
